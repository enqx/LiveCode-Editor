<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect x='10' y='30' width='100' height='60' rx='18' fill='%23FF0000'/%3E%3Cpath d='M42 44 L28 60 L42 76' fill='none' stroke='%23FFFFFF' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M78 44 L92 60 L78 76' fill='none' stroke='%23FFFFFF' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M66 40 L54 80' fill='none' stroke='%23FFFFFF' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <title>Live Code Editor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CodeMirror (Für den Code-Editor) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.css">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #212529;
            color: white;
        }

        /* Obere Leiste */
        .top-bar {
            padding: 10px 20px;
            background-color: #1a1d20;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        /* Animiertes ausklappbares Menü */
        .yt-controls {
            display: flex;
            align-items: center;
            overflow: hidden;
            max-width: 0;
            opacity: 0;
            white-space: nowrap;
            transition: max-width 0.4s ease, opacity 0.4s ease, margin-left 0.4s ease;
        }

        .yt-controls.open {
            max-width: 850px;
            opacity: 1;
            margin-left: 15px;
        }

        /* Pfeil Animation */
        #toggle-arrow {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .arrow-rotated {
            transform: rotate(180deg);
        }

        /* Hauptbereich: Editor + Vorschau */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }

        .editors {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #444;
        }

        .editor-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .editor-title {
            background: #1e1f29;
            padding: 5px 10px;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #444;
            color: #ff79c6;
        }

        .CodeMirror {
            flex: 1;
            height: 100% !important;
            font-size: 15px;
        }

        /* Rechte Seite: Live-Vorschau */
        .preview-container {
            width: 50%;
            background: white;
        }

        iframe.preview-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Das YouTube Video (Unten Links) */
        .yt-corner {
            position: fixed;
            bottom: 15px;
            left: 15px;
            width: 6cm;
            height: 3.375cm;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            border: 2px solid #444;
            border-radius: 8px;
            background: black;
            overflow: hidden;
        }

        /* Die Iframe-Klasse für das Video */
        .yt-corner iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Styling für die Autocomplete-Vorschläge */
        .CodeMirror-hints {
            background: #282a36;
            border: 1px solid #6272a4;
            color: #f8f8f2;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            padding: 5px 0;
        }

        .CodeMirror-hint {
            color: #8be9fd;
            padding: 2px 10px;
        }

        li.CodeMirror-hint-active {
            background: #44475a;
            color: #ff79c6;
        }
    </style>
</head>

<body>

    <!-- Obere Leiste -->
    <div class="top-bar">
        <h5 class="m-0 text-danger fw-bold">Live Code Editor</h5>
        <button class="btn btn-sm btn-outline-secondary ms-3" onclick="toggleMenu()"
            title="YouTube Menü ein/ausklappen">
            <span id="toggle-arrow">➤</span>
        </button>
        <div id="yt-menu" class="yt-controls">
            <label for="videoId" class="form-label m-0 text-light me-2">Video ID:</label>
            <input type="text" class="form-control form-control-sm bg-dark text-light border-secondary me-2"
                id="videoId" placeholder="z.B. dQw4w9WgXcQ" value="xKOyDDuQSVY" style="width: 180px;">
            <button class="btn btn-outline-light btn-sm me-4" onclick="loadVideo()">Laden</button>

            <a href="javascript:void(0)" id="resumeLink" class="text-info me-4"
                style="display:none; text-decoration:none; font-size: 0.9rem;" onclick="resumeLastVideo()">Zuletzt:
                ...</a>

            <label for="volumeSlider" class="form-label m-0 text-light me-2">🔉 Lautstärke:</label>
            <input type="range" class="form-range" id="volumeSlider" min="0" max="100" value="5" style="width: 120px;"
                oninput="changeVolume(this.value)">
        </div>
    </div>

    <!-- Hauptbereich -->
    <div class="workspace">
        <div class="editors">
            <div class="editor-box">
                <div class="editor-title">HTML</div>
                <textarea id="html-code"></textarea>
            </div>
            <div class="editor-box">
                <div class="editor-title">CSS</div>
                <textarea id="css-code"></textarea>
            </div>
            <div class="editor-box">
                <div class="editor-title">JavaScript</div>
                <textarea id="js-code"></textarea>
            </div>
        </div>

        <div class="preview-container">
            <iframe id="preview-frame" class="preview-frame"></iframe>
        </div>
    </div>

    <!-- YouTube Video (Wird nun sicher per JavaScript vorgebaut) -->
    <div class="yt-corner" id="yt-container"></div>

    <!-- CodeMirror Grundskripte -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <!-- CodeMirror Autocomplete & Auto-Close Skripte -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/show-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/xml-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/html-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/css-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/hint/javascript-hint.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closetag.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>

    <script>
        // --- 1. LÖSUNG GEGEN DEN POSTMESSAGE FEHLER ---
        // Wir bauen das iFrame manuell auf, MIT korrekter URL und enablejsapi=1, BEVOR die API lädt.
        const currentOrigin = encodeURIComponent(window.location.origin);
        document.getElementById('yt-container').innerHTML =
            `<iframe id="ytPlayer" 
                     src="https://www.youtube.com/embed/xKOyDDuQSVY?enablejsapi=1&autoplay=1&controls=1&origin=${currentOrigin}" 
                     allow="autoplay; fullscreen" 
                     style="width: 100%; height: 100%; border: none;">
             </iframe>`;

        // --- 2. YouTube API laden ---
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let player;
        let saveStateInterval;

        function onYouTubeIframeAPIReady() {
            // Die API muss den Player nicht mehr neu bauen, sondern "verbindet" sich nur mit unserem fertigen iframe.
            player = new YT.Player('ytPlayer', {
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
            showResumeLink();
        }

        function onPlayerReady(event) {
            const initialVolume = document.getElementById('volumeSlider').value;
            player.setVolume(initialVolume);
            player.playVideo();
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                if (!saveStateInterval) {
                    saveStateInterval = setInterval(saveCurrentVideoState, 2000);
                }
            } else {
                clearInterval(saveStateInterval);
                saveStateInterval = null;
            }
        }

        function saveCurrentVideoState() {
            if (player && player.getCurrentTime) {
                const time = player.getCurrentTime();
                const videoData = player.getVideoData();
                const currentId = (videoData && videoData.video_id) ? videoData.video_id : document.getElementById('videoId').value.trim();

                if (currentId === 'xKOyDDuQSVY') return;

                if (currentId && time > 0) {
                    localStorage.setItem('fakeTube_lastVideo', JSON.stringify({ id: currentId, time: time }));
                    showResumeLink();
                }
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ":" + (s < 10 ? "0" : "") + s;
        }

        function showResumeLink() {
            const saved = localStorage.getItem('fakeTube_lastVideo');
            if (saved) {
                const data = JSON.parse(saved);
                const link = document.getElementById('resumeLink');
                link.style.display = 'inline';
                link.innerText = `Zuletzt: ${data.id} (${formatTime(data.time)})`;
            }
        }

        function resumeLastVideo() {
            const saved = localStorage.getItem('fakeTube_lastVideo');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('videoId').value = data.id;
                player.loadVideoById({ videoId: data.id, startSeconds: data.time });
            }
        }

        function changeVolume(val) { if (player && player.setVolume) player.setVolume(val); }

        function loadVideo() {
            const videoId = document.getElementById('videoId').value.trim();
            if (videoId && player && player.loadVideoById) player.loadVideoById(videoId);
            else alert("Bitte eine gültige Video-ID eingeben.");
        }

        function toggleMenu() {
            document.getElementById('yt-menu').classList.toggle('open');
            document.getElementById('toggle-arrow').classList.toggle('arrow-rotated');
        }

        // --- Code Editor Logik ---
        const defaultHtml = `<h1 style="text-align:center; font-family:sans-serif;">Function Test!</h1>\n<p style="text-align:center;">Button is for the Funktion Test</p>\n<button id="button1"></button>\n<h3 style="font-family:sans-serif;" id="text1">Test!</h3>`;
        const defaultCss = `body { background-color: #f0f0f0; }\n\nbutton { background-color: #3455; height: 5em; width: 5em; }\n\nbutton:active { background-color: #3458; }`;
        const defaultJs = `document.addEventListener('DOMContentLoaded', () => {\n    const meinButton = document.getElementById('button1');\n    const meinText = document.getElementById('text1');\n\n    if (meinButton && meinText) {\n        meinButton.addEventListener('click', () => {\n            meinText.style.color = 'red';\n        });\n    }\n    console.log('Alles bereit!');\n});\n`;

        document.getElementById("html-code").value = localStorage.getItem("fakeTube_html") || defaultHtml;
        document.getElementById("css-code").value = localStorage.getItem("fakeTube_css") || defaultCss;
        document.getElementById("js-code").value = localStorage.getItem("fakeTube_js") || defaultJs;

        const editorOptions = {
            theme: "dracula",
            lineNumbers: true,
            autoCloseBrackets: true,
            extraKeys: { "Ctrl-Space": "autocomplete" }
        };

        const htmlEditor = CodeMirror.fromTextArea(document.getElementById("html-code"), { ...editorOptions, mode: "text/html", autoCloseTags: true });
        const cssEditor = CodeMirror.fromTextArea(document.getElementById("css-code"), { ...editorOptions, mode: "css" });
        const jsEditor = CodeMirror.fromTextArea(document.getElementById("js-code"), { ...editorOptions, mode: "javascript" });

        function enableAutoSuggest(editor) {
            editor.on("inputRead", function (cm, change) {
                if (!cm.state.completionActive && change.text[0].match(/^[a-zA-Z0-9_<\-\.]$/)) {
                    CodeMirror.commands.autocomplete(cm, null, { completeSingle: false });
                }
            });
        }
        enableAutoSuggest(htmlEditor);
        enableAutoSuggest(cssEditor);
        enableAutoSuggest(jsEditor);

        let updateTimeout;
        function updatePreview() {
            clearTimeout(updateTimeout);

            updateTimeout = setTimeout(() => {
                const html = htmlEditor.getValue();
                const cssCode = cssEditor.getValue();
                const jsCode = jsEditor.getValue();

                localStorage.setItem("fakeTube_html", html);
                localStorage.setItem("fakeTube_css", cssCode);
                localStorage.setItem("fakeTube_js", jsCode);

                const css = `<style>${cssCode}</style>`;
                const js = `<script>${jsCode}<\/script>`;

                const fullCode = html + css + js;
                document.getElementById("preview-frame").srcdoc = fullCode;

            }, 300);
        }

        htmlEditor.on("change", updatePreview);
        cssEditor.on("change", updatePreview);
        jsEditor.on("change", updatePreview);

        updatePreview();
    </script>
</body>

</html>
