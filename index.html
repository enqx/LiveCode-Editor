<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect x='10' y='30' width='100' height='60' rx='18' fill='%23FF0000'/%3E%3Cpath d='M42 44 L28 60 L42 76' fill='none' stroke='%23FFFFFF' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M78 44 L92 60 L78 76' fill='none' stroke='%23FFFFFF' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M66 40 L54 80' fill='none' stroke='%23FFFFFF' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <title>Live Code Editor</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CodeMirror (Für den Code-Editor) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #212529;
            color: white;
        }

        /* Obere Leiste (YouTube Steuerung) */
        .top-bar {
            padding: 10px 20px;
            background-color: #1a1d20;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        /* Animiertes ausklappbares Menü */
        .yt-controls {
            display: flex;
            align-items: center;
            overflow: hidden;
            max-width: 0;
            opacity: 0;
            white-space: nowrap;
            transition: max-width 0.4s ease, opacity 0.4s ease, margin-left 0.4s ease;
        }

        /* Klasse, wenn das Menü geöffnet ist - max-width für Lautstärkeregler erhöht */
        .yt-controls.open {
            max-width: 650px;
            /* Genug Platz für Input + Button + Lautstärke */
            opacity: 1;
            margin-left: 15px;
        }

        /* Pfeil Animation */
        #toggle-arrow {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .arrow-rotated {
            transform: rotate(180deg);
        }

        /* Hauptbereich: Editor + Vorschau */
        .workspace {
            display: flex;
            flex: 1;
            height: calc(100vh - 60px);
        }

        /* Linke Seite: Code-Editoren */
        .editors {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #444;
        }

        .editor-box {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .editor-title {
            background: #1e1f29;
            padding: 5px 10px;
            font-size: 14px;
            font-weight: bold;
            border-bottom: 1px solid #444;
            color: #ff79c6;
        }

        .CodeMirror {
            flex: 1;
            height: 100% !important;
            font-size: 15px;
        }

        /* Rechte Seite: Live-Vorschau */
        .preview-container {
            width: 50%;
            background: white;
        }

        iframe.preview-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Das YouTube Video (Unten Links, exakt 6cm breit) */
        .yt-corner {
            position: fixed;
            bottom: 15px;
            left: 15px;
            width: 6cm;
            height: 3.375cm;
            /* 16:9 Format passend zu 6cm */
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
            border: 2px solid #444;
            border-radius: 8px;
            background: black;
            overflow: hidden;
        }

        .yt-corner iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <!-- Obere Leiste mit dem neuen Toggle-Button -->
    <div class="top-bar">
        <h5 class="m-0 text-danger fw-bold">Live Code Editor</h5>

        <!-- Der Pfeil-Button -->
        <button class="btn btn-sm btn-outline-secondary ms-3" onclick="toggleMenu()"
            title="YouTube Menü ein/ausklappen">
            <span id="toggle-arrow">➤</span>
        </button>

        <!-- Das versteckte Menü, das seitlich ausfährt -->
        <div id="yt-menu" class="yt-controls">
            <label for="videoId" class="form-label m-0 text-light me-2">Video ID:</label>
            <input type="text" class="form-control form-control-sm bg-dark text-light border-secondary me-2"
                id="videoId" placeholder="z.B. dQw4w9WgXcQ" value="jfKfPfyJRdk" style="width: 180px;">
            <button class="btn btn-outline-light btn-sm me-4" onclick="loadVideo()">Laden</button>

            <!-- Hinzugefügt: Lautstärkeregler -->
            <label for="volumeSlider" class="form-label m-0 text-light me-2">🔉 Lautstärke:</label>
            <input type="range" class="form-range" id="volumeSlider" min="0" max="100" value="20" style="width: 120px;"
                oninput="changeVolume(this.value)">
        </div>
    </div>

    <!-- Hauptbereich -->
    <div class="workspace">
        <!-- Editor Bereich -->
        <div class="editors">
            <div class="editor-box">
                <div class="editor-title">HTML</div>
                <textarea
                    id="html-code"><h1 style="text-align:center; font-family:sans-serif;">Willkommen beim Coden!</h1>&#10;<p style="text-align:center;">Klicke oben auf den Pfeil, um die Video-ID und Lautstärke zu ändern.</p></textarea>
            </div>
            <div class="editor-box">
                <div class="editor-title">CSS</div>
                <textarea id="css-code">body { background-color: #f0f0f0; }</textarea>
            </div>
            <div class="editor-box">
                <div class="editor-title">JavaScript</div>
                <textarea id="js-code">console.log("Alles bereit!");</textarea>
            </div>
        </div>

        <!-- Vorschau Bereich -->
        <div class="preview-container">
            <iframe id="preview-frame" class="preview-frame"></iframe>
        </div>
    </div>

    <!-- YouTube Video Unten Links (Angepasst für API) -->
    <div class="yt-corner">
        <div id="ytPlayer"></div>
    </div>

    <!-- Skripte -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

    <!-- Hinzugefügt: YouTube Iframe API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // --- YouTube API Logik für Laden und Lautstärke ---
        let player;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytPlayer', {
                videoId: document.getElementById('videoId').value.trim(),
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            const initialVolume = document.getElementById('volumeSlider').value;
            player.setVolume(initialVolume);
        }

        function changeVolume(val) {
            if (player && player.setVolume) {
                player.setVolume(val);
            }
        }

        function loadVideo() {
            const videoId = document.getElementById('videoId').value.trim();
            if (videoId && player && player.loadVideoById) {
                player.loadVideoById(videoId);
            } else {
                alert("Bitte eine gültige Video-ID eingeben.");
            }
        }

        // --- 1. Neu: Toggle Funktion für das Menü ---
        function toggleMenu() {
            const menu = document.getElementById('yt-menu');
            const arrow = document.getElementById('toggle-arrow');

            // Klasse "open" hinzufügen oder entfernen (steuert die CSS Animation)
            menu.classList.toggle('open');
            arrow.classList.toggle('arrow-rotated');
        }

        // --- 3. Code Editor Logik ---
        const htmlEditor = CodeMirror.fromTextArea(document.getElementById("html-code"), { mode: "xml", theme: "dracula", lineNumbers: true });
        const cssEditor = CodeMirror.fromTextArea(document.getElementById("css-code"), { mode: "css", theme: "dracula", lineNumbers: true });
        const jsEditor = CodeMirror.fromTextArea(document.getElementById("js-code"), { mode: "javascript", theme: "dracula", lineNumbers: true });

        function updatePreview() {
            const html = htmlEditor.getValue();
            const css = `<style>${cssEditor.getValue()}</style>`;
            const js = `<script>${jsEditor.getValue()}<\/script>`;

            const previewFrame = document.getElementById("preview-frame");
            const preview = previewFrame.contentDocument || previewFrame.contentWindow.document;

            preview.open();
            preview.write(html + css + js);
            preview.close();
        }

        htmlEditor.on("change", updatePreview);
        cssEditor.on("change", updatePreview);
        jsEditor.on("change", updatePreview);

        updatePreview();
    </script>
</body>

</html>
